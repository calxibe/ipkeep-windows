name: Build and unsigned preview

on:
  push:
    branches: [main, 'installer/**']
    tags: ['v*-preview.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test and publish Windows client and service
        run: ./build.ps1
      - name: Package unsigned preview
        run: ./scripts/package.ps1 -Commit $env:GITHUB_SHA
      - name: Build unsigned beta installer
        run: ./scripts/build-installer.ps1
      - name: Test installer on this disposable Windows runner
        run: |
          $installers = @(Get-ChildItem -LiteralPath dist/releases -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected one installer to test.' }
          dotnet run --project tests/IPKeep.InstallerTests/IPKeep.InstallerTests.csproj -c Release -- --disposable-runner $installers[0].FullName
      - name: Preserve installer test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-test-logs
          path: dist/releases/installer-test-logs/
          if-no-files-found: ignore
      - name: Preserve unsigned binaries for origin verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: IPKeep-windows-x64-unsigned
          path: dist/IPKeep/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve downloadable preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-download
          path: |
            dist/releases/*.exe
            dist/releases/*.zip
            dist/releases/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  preview-release:
    if: github.repository == 'calxibe/ipkeep-windows' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-download
          path: release-assets
      - name: Publish unsigned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" release-assets/*
          --verify-tag --prerelease --latest=false
          --title "IPKeep $RELEASE_TAG — unsigned preview"
          --notes-file docs/preview-release.md
